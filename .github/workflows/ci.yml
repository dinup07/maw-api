name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maw
          POSTGRES_PASSWORD: maw
          POSTGRES_DB: maw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maw -d maw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    env:
      MAW_TEST_DATABASE_URL: postgresql://maw:maw@localhost:5432/maw
      MAW_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests mocks scripts
      - run: uv run ruff format --check src tests mocks scripts
      - run: uv run maw validate workflows/*.json
      - run: uv run pytest -q -rs

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for /ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "MAW did not become ready" >&2
          exit 1
      - name: End-to-end billing question
        run: |
          curl -sf localhost:8000/v1/runs -H 'content-type: application/json' \
            -d '{"workflow_id": "support_triage", "input": "Was INV-1001 charged twice?"}' | tee response.json
          grep -q refund response.json
      - name: End-to-end RAG (ingest into internal pgvector, then retrieve)
        run: |
          python3 - <<'PY' > ingest.json
          import json, pathlib
          docs = [{"id": p.name, "text": p.read_text(), "metadata": {"source": p.name}}
                  for p in sorted(pathlib.Path("examples/docs").glob("*.md"))]
          print(json.dumps({"documents": docs}))
          PY
          curl -sf localhost:8000/v1/vector-stores/docs/documents -H 'content-type: application/json' -d @ingest.json
          python3 -c "import json; print(json.dumps({'workflow': json.load(open('examples/rag_qa.json')), 'input': 'how many days of annual leave do I get'}))" > rag.json
          curl -sf localhost:8000/v1/runs -H 'content-type: application/json' -d @rag.json | tee rag_response.json
          grep -q annual-leave.md rag_response.json
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

# Server-side connections (trusted). Workflows reference these by name.
# - Values may use ${env:NAME} or ${env:NAME:-default} (this file only) and ${secret:NAME}
#   (reads MAW_SECRET_NAME; also allowed inside workflow definitions).
# - stdio MCP servers may only be declared here, never inside a submitted workflow.
# - Workflow-level `mcp_servers` / `agents` entries with the same name take precedence.
mcp_servers:
  kb:
    transport: streamable_http
    url: ${env:KB_MCP_URL:-http://localhost:8001/mcp}
  # github:
  #   url: https://api.githubcopilot.com/mcp/
  #   headers:
  #     Authorization: Bearer ${secret:GITHUB_TOKEN}
  # filesystem:
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
agents:
  billing:
    url: ${env:BILLING_AGENT_URL:-http://localhost:9001}
    description: Answers questions about invoices, charges and refunds.
vector_stores:
  # Internal store: pgvector tables inside MAW's own Postgres (needs MAW_DATABASE_URL).
  # Fill it with `maw ingest docs FILE...` or POST /v1/vector-stores/docs/documents.
  docs:
    provider: pgvector
    collection: docs
    description: Company documentation (IT, HR and billing policies).
    # "scripted" embeddings are keyless keyword hashing, for demos. For real semantic search use e.g.
    #   embedding: {provider: google_genai, model: models/gemini-embedding-001}   (GOOGLE_API_KEY)
    #   embedding: {provider: openai, model: text-embedding-3-small}     (OPENAI_API_KEY)
    # A collection only accepts one embedding model: switch models by changing `collection` too.
    embedding:
      provider: scripted
      model: hashing-256
  # The same documents with real semantic embeddings. Each store has its own collection, because a
  # collection only ever holds vectors from one embedding model.
  docs_gemini:                     # needs GOOGLE_API_KEY (Google AI Studio)
    provider: pgvector
    collection: docs_gemini
    description: Company documentation (IT, HR and billing policies).
    embedding:
      provider: google_genai
      model: models/gemini-embedding-001
      params: {output_dimensionality: 768}
  docs_openai:                     # needs OPENAI_API_KEY
    provider: pgvector
    collection: docs_openai
    description: Company documentation (IT, HR and billing policies).
    embedding:
      provider: openai
      model: text-embedding-3-small
  # External store (Qdrant): start one with `docker compose --profile qdrant up -d`.
  # research:
  #   provider: qdrant
  #   url: ${env:QDRANT_URL:-http://localhost:6333}
  #   api_key: ${secret:QDRANT_API_KEY}
  #   collection: research
  #   embedding: {provider: openai, model: text-embedding-3-small}
